name: note_me
description: "Note Me — offline-first Markdown notebook for Android (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Storage — pinned like the reference repo to avoid the shared_preferences_android drift bug
  shared_preferences: ^2.3.2
  # Markdown parsing for notes
  markdown: ^7.2.1
  # Encryption for vault notes (AES/CBC via pure Dart)
  pointycastle: ^3.9.1

dependency_overrides:
  # Pinned on purpose (mirrors reference-repo Session-4 rule): shared_preferences_android
  # 2.5.0+ introduced Pigeon JNI that caused silent black-screen builds. Keep 2.4.28.
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
