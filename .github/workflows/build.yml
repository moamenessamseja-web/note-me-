name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: an unpinned 'stable' once silently changed plugin resolution and
          # produced a black-screen build in a sibling project. Bump deliberately.
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Toolchain fingerprint (recorded in the release notes)
        run: |
          flutter --version 2>&1 | tee toolchain.txt

      - name: Generate android/ scaffold (not committed)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org app.noteme --project-name note_me .
          fi
          # `flutter create .` writes a default test/widget_test.dart referencing MyApp.
          # Our real suite lives in test/*_test.dart; drop the generated placeholder.
          rm -f test/widget_test.dart
          # Launcher label (default would be "note_me").
          sed -i 's/android:label="[^"]*"/android:label="Note Me"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Guard - dependency drift (shared_preferences_android must stay 2.4.28)
        run: |
          v=$(awk '/^  shared_preferences_android:/{f=1} f && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "resolved shared_preferences_android=$v"
          test "$v" = "2.4.28"
          echo "" >> toolchain.txt
          echo "shared_preferences_android=$v" >> toolchain.txt

      - name: Format check (report only for now)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis (warnings and errors are fatal, infos are not)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee build_log.txt

      - name: Tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a build_log.txt

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a build_log.txt

      - name: Create release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            --target "${{ github.sha }}" \
            --title "Note Me APK build #${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }} (branch ${{ github.ref_name }}).

          Toolchain:
          $(cat toolchain.txt)"

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${{ github.run_number }}"
          tail -n 500 build_log.txt > build_log_tail.txt || echo "no log" > build_log_tail.txt
          gh release create "$TAG" "build_log_tail.txt" \
            --title "Build FAILED log #${{ github.run_number }}" \
            --notes "Failure log from commit ${{ github.sha }}"
